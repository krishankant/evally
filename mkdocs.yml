site_name: evally
site_description: Judge an LLM app with evidence instead of gut feel.
site_url: https://krishankant.github.io/evally/
repo_url: https://github.com/krishankant/evally
repo_name: krishankant/evally
edit_uri: edit/main/
docs_dir: site
site_dir: _site
strict: true
# site/ is symlinks; watch the real folders so `mkdocs serve` rebuilds on edits
watch: [README.md, COURSE_PLAN.md, lessons, concepts]

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css: [stylesheets/extra.css]
hooks: [site_hooks/links.py]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Course plan: COURSE_PLAN.md
  - Lessons:
      - "1 · Baseline": lessons/week01-baseline.md
      - "2 · Error analysis": lessons/week02-error-analysis.md
      - "3 · Test datasets": lessons/week03-test-datasets.md
      - "4 · Code-based graders": lessons/week04-code-graders.md
      - "5 · LLM as a grader": lessons/week05-llm-graders.md
  - Concepts:
      - concepts/README.md
      - "Metrics map: which metric, when": concepts/metrics-map.md
      - "05 · LLM as a grader": concepts/05-llm-as-a-grader.md
      - "06 · Testing the grader": concepts/06-testing-the-grader.md
      - "07 · Statistics for evals": concepts/07-statistics-for-evals.md
      - "08 · Side-by-side comparison": concepts/08-side-by-side.md
      - "09 · RAG checks": concepts/09-rag-checks.md
      - "10 · Agent and multi-turn checks": concepts/10-agent-checks.md
      - "11 · Safety checks": concepts/11-safety-checks.md
      - "12 · Evals on every change": concepts/12-ci-gates.md
      - "13 · Production monitoring": concepts/13-monitoring.md
      - "14 · Cost and speed": concepts/14-cost-and-speed.md
      - "15 · Capstone": concepts/15-capstone.md
