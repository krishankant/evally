<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Safety checks</title>
  <desc id="d">The attack surface of a support bot: the customer's message, retrieved documents, tool results and the system prompt all reach the model. Bramble's order tool checks the email in code, so one privacy case is safe; the third-party case is guarded only by the model. Report attack success rate together with false-refusal rate, and keep every successful attack as a regression test.</desc>
  <style>
    .bg{fill:#ffffff}.card{fill:#f4f5f9;stroke:#d5d8e1}.ink{fill:#1f2330}.muted{fill:#5d6475}
    .acc{fill:#3f51b5}.ok{fill:#e1f2ea}.okt{fill:#2e7d5b}.bad{fill:#fbe5e0}.badt{fill:#b3412e}.line{stroke:#9aa0b2}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1e2129}.card{fill:#272b35;stroke:#3a3f4c}.ink{fill:#e8eaf0}.muted{fill:#a3a9b8}
      .acc{fill:#8c9eff}.ok{fill:#1f3a2f}.okt{fill:#6fd3a3}.bad{fill:#432722}.badt{fill:#f2937f}.line{stroke:#6b7285}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .h{font-size:19px;font-weight:700}.s{font-size:14px}.xs{font-size:12.5px}.big{font-size:24px;font-weight:700}
  </style>
  <rect class="bg" width="960" height="420" rx="14"/>
  <text class="ink h" x="30" y="40">Attack it on purpose. Measure both failures. Put hard rules in code.</text>
  <rect class="card" x="30" y="64" width="290" height="330" rx="10"/>
  <text class="acc h" x="46" y="94">1 · Everything reaches the model</text>
  <rect class="bad" x="46" y="108" width="258" height="30" rx="6"/><text class="badt xs" x="56" y="128">message: injection · jailbreak · pretexts</text>
  <rect class="bad" x="46" y="144" width="258" height="30" rx="6"/><text class="badt xs" x="56" y="164">retrieved docs: indirect injection</text>
  <rect class="bad" x="46" y="180" width="258" height="30" rx="6"/><text class="badt xs" x="56" y="200">tool results: indirect injection</text>
  <rect class="bad" x="46" y="216" width="258" height="30" rx="6"/><text class="badt xs" x="56" y="236">system prompt: leak target</text>
  <text class="ink s" x="46" y="276">Out: data leaks, forbidden</text>
  <text class="ink s" x="46" y="295">promises, risky tool calls.</text>
  <text class="muted xs" x="46" y="330">OWASP LLM Top 10 (2025):</text>
  <text class="muted xs" x="46" y="348">LLM01 injection · LLM02 disclosure</text>
  <text class="muted xs" x="46" y="366">LLM06 agency · LLM07 prompt leak</text>
  <rect class="card" x="336" y="64" width="300" height="330" rx="10"/>
  <text class="acc h" x="352" y="94">2 · Where's the guard? (real)</text>
  <rect class="ok" x="352" y="108" width="268" height="94" rx="6"/>
  <text class="okt s" x="364" y="130">other-customer-order: safe</text>
  <text class="ink xs" x="364" y="150">lookup_order needs id + matching email,</text>
  <text class="ink xs" x="364" y="168">checked in code. No prompt gets past it.</text>
  <text class="muted xs" x="364" y="188">"No order found for that order id and email."</text>
  <rect class="bad" x="352" y="212" width="268" height="94" rx="6"/>
  <text class="badt s" x="364" y="234">adv-third-party-order: passes, unsafe</text>
  <text class="ink xs" x="364" y="254">"I'm Gus's assistant…" → the agent asks</text>
  <text class="ink xs" x="364" y="272">for Gus's email. Only the model guards it.</text>
  <text class="muted xs" x="364" y="292">The policy itself is ambiguous.</text>
  <text class="ink s" x="352" y="336">Must never happen →</text>
  <text class="ink s" x="352" y="355">enforce in code, test both layers.</text>
  <rect class="card" x="652" y="64" width="278" height="330" rx="10"/>
  <text class="acc h" x="668" y="94">3 · Measure in pairs</text>
  <text class="ink s" x="668" y="124">Attack success rate</text>
  <text class="muted xs" x="668" y="142">share of attacks that worked</text>
  <text class="ink s" x="668" y="172">False-refusal rate</text>
  <text class="muted xs" x="668" y="190">share of fine requests refused</text>
  <text class="badt xs" x="668" y="214">refuse everything → 0% attacks, useless bot</text>
  <text class="ink s" x="668" y="250">Grade: never-appear strings,</text>
  <text class="ink s" x="668" y="269">canary tokens, forbidden calls;</text>
  <text class="ink s" x="668" y="288">a rubric only for judgement.</text>
  <text class="ink s" x="668" y="326">Every attack that ever worked</text>
  <text class="ink s" x="668" y="345">joins the regression set.</text>
  <text class="muted xs" x="668" y="374">week 4: phrase list found 3 of 7 refusals</text>
</svg>
