<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Cost and speed</title>
  <desc id="d">Cost per successful case, not per call: at illustrative prices qwen costs 0.0065 dollars per passing dev case and llama 0.0024. Grading the dev replies cost about three times producing them. Read latency as percentiles: an illustrative mean of 2.33 seconds hides a p95 of 7.0. Choose along the Pareto front after dropping options that break a hard limit.</desc>
  <style>
    .bg{fill:#ffffff}.card{fill:#f4f5f9;stroke:#d5d8e1}.ink{fill:#1f2330}.muted{fill:#5d6475}
    .acc{fill:#3f51b5}.accs{stroke:#3f51b5}.ok{fill:#e1f2ea}.okt{fill:#2e7d5b}.bad{fill:#fbe5e0}.badt{fill:#b3412e}.line{stroke:#9aa0b2}.grey{fill:#b8bcc8}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1e2129}.card{fill:#272b35;stroke:#3a3f4c}.ink{fill:#e8eaf0}.muted{fill:#a3a9b8}
      .acc{fill:#8c9eff}.accs{stroke:#8c9eff}.ok{fill:#1f3a2f}.okt{fill:#6fd3a3}.bad{fill:#432722}.badt{fill:#f2937f}.line{stroke:#6b7285}.grey{fill:#5a6070}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .h{font-size:19px;font-weight:700}.s{font-size:14px}.xs{font-size:12.5px}.big{font-size:24px;font-weight:700}
  </style>
  <rect class="bg" width="960" height="420" rx="14"/>
  <text class="ink h" x="30" y="40">Three numbers decide: quality, cost per success, latency percentiles.</text>
  <rect class="card" x="30" y="64" width="290" height="330" rx="10"/>
  <text class="acc h" x="46" y="94">1 · Cost per success</text>
  <text class="muted xs" x="46" y="116">real tokens, illustrative $1/M in, $5/M out</text>
  <text class="ink s" x="46" y="146">qwen  10/16 passed</text><text class="badt s" x="214" y="146">$0.0065</text>
  <text class="ink s" x="46" y="170">llama 13/16 passed</text><text class="okt s" x="214" y="170">$0.0024</text>
  <text class="muted xs" x="46" y="190">per passing case; llama: ¼ of the output tokens</text>
  <rect class="bad" x="46" y="206" width="258" height="56" rx="6"/>
  <text class="badt xs" x="58" y="228">Agents re-send history: return-too-late</text>
  <text class="badt xs" x="58" y="246">4 calls, 4,852 input tokens (5× a 1-call case)</text>
  <text class="ink s" x="46" y="292">The grader is on the bill:</text>
  <text class="ink s" x="46" y="312">grading the dev replies cost</text>
  <text class="badt big" x="46" y="346">~3× the app</text>
  <rect class="card" x="336" y="64" width="300" height="330" rx="10"/>
  <text class="acc h" x="352" y="94">2 · Latency: the tail</text>
  <text class="muted xs" x="352" y="116">10 illustrative conversations (s)</text>
  <g>
    <rect class="grey" x="352" y="138" width="16" height="10"/><rect class="grey" x="352" y="152" width="18" height="10"/>
    <rect class="grey" x="352" y="166" width="20" height="10"/><rect class="grey" x="352" y="180" width="22" height="10"/>
    <rect class="grey" x="352" y="194" width="24" height="10"/><rect class="grey" x="352" y="208" width="26" height="10"/>
    <rect class="grey" x="352" y="222" width="30" height="10"/><rect class="grey" x="352" y="236" width="40" height="10"/>
    <rect class="grey" x="352" y="250" width="80" height="10"/><rect class="grey" x="352" y="264" width="190" height="10"/>
  </g>
  <text class="ink s" x="472" y="160">mean   2.33 s</text>
  <text class="okt s" x="472" y="184">p50    1.25 s</text>
  <text class="badt s" x="472" y="208">p95    7.03 s</text>
  <text class="badt s" x="472" y="232">p99    9.01 s</text>
  <text class="ink s" x="352" y="308">5-turn chat: 23% chance at</text>
  <text class="ink s" x="352" y="327">least one turn is slower than p95.</text>
  <text class="muted xs" x="352" y="360">Time to first token is what people feel.</text>
  <rect class="card" x="652" y="64" width="278" height="330" rx="10"/>
  <text class="acc h" x="668" y="94">3 · Choose on the front</text>
  <line class="line" x1="690" y1="300" x2="910" y2="300" stroke-width="1.5"/>
  <line class="line" x1="690" y1="120" x2="690" y2="300" stroke-width="1.5"/>
  <text class="muted xs" x="860" y="318">cost →</text><text class="muted xs" x="660" y="116">quality</text>
  <polyline class="accs" points="702,262 740,200 790,170 890,140" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle class="acc" cx="702" cy="262" r="6"/><circle class="acc" cx="740" cy="200" r="6"/>
  <circle class="acc" cx="790" cy="170" r="6"/><circle class="acc" cx="890" cy="140" r="6"/>
  <circle class="grey" cx="810" cy="230" r="5"/><circle class="grey" cx="860" cy="200" r="5"/>
  <text class="muted xs" x="820" y="246">dominated: drop</text>
  <text class="ink xs" x="668" y="344">1 drop options over a hard limit</text>
  <text class="ink xs" x="668" y="362">2 keep the front · 3 choose openly</text>
</svg>
