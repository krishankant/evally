<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Statistics for evals</title>
  <desc id="d">A pass rate is an estimate. qwen's 10 of 16 has a Wilson range of 39 to 82 percent and llama's 13 of 16 a range of 57 to 93 percent. Comparing on the same cases, only five cases flipped, four one way and one the other, so McNemar's p is 0.375 and the paired range for the difference is minus 6 to plus 44 points. Plus 10 points needs about 100 cases.</desc>
  <style>
    .bg{fill:#ffffff}.card{fill:#f4f5f9;stroke:#d5d8e1}.ink{fill:#1f2330}.muted{fill:#5d6475}
    .acc{fill:#3f51b5}.accs{stroke:#3f51b5}.ok{fill:#e1f2ea}.okt{fill:#2e7d5b}.bad{fill:#fbe5e0}.badt{fill:#b3412e}.line{stroke:#9aa0b2}.axis{stroke:#c3c7d2}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1e2129}.card{fill:#272b35;stroke:#3a3f4c}.ink{fill:#e8eaf0}.muted{fill:#a3a9b8}
      .acc{fill:#8c9eff}.accs{stroke:#8c9eff}.ok{fill:#1f3a2f}.okt{fill:#6fd3a3}.bad{fill:#432722}.badt{fill:#f2937f}.line{stroke:#6b7285}.axis{stroke:#4a5060}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .h{font-size:19px;font-weight:700}.s{font-size:14px}.xs{font-size:12.5px}.big{font-size:26px;font-weight:700}
  </style>
  <rect class="bg" width="960" height="420" rx="14"/>
  <text class="ink h" x="30" y="40">A pass rate is an estimate. Give it a range; compare on the same cases.</text>

  <!-- 1 range -->
  <rect class="card" x="30" y="64" width="330" height="330" rx="10"/>
  <text class="acc h" x="46" y="94">1 · How sure? (Wilson 95%)</text>
  <line class="axis" x1="60" y1="250" x2="340" y2="250" stroke-width="1.5"/>
  <text class="muted xs" x="54" y="270">0%</text><text class="muted xs" x="190" y="270">50%</text><text class="muted xs" x="318" y="270">100%</text>
  <text class="ink s" x="46" y="140">qwen 10/16 = 62.5%</text>
  <line class="accs" x1="168" y1="160" x2="288" y2="160" stroke-width="8" stroke-linecap="round"/>
  <circle class="acc" cx="235" cy="160" r="7"/>
  <text class="muted xs" x="150" y="182">39%</text><text class="muted xs" x="282" y="182">82%</text>
  <text class="ink s" x="46" y="208">llama 13/16 = 81.3%</text>
  <line class="accs" x1="220" y1="228" x2="321" y2="228" stroke-width="8" stroke-linecap="round"/>
  <circle class="acc" cx="288" cy="228" r="7"/>
  <text class="ink s" x="46" y="304">The ranges overlap almost</text>
  <text class="ink s" x="46" y="323">everywhere. Don't stop here:</text>
  <text class="ink s" x="46" y="342">both ran on the same cases.</text>
  <text class="muted xs" x="46" y="375">real, bramble-v2 dev</text>

  <!-- 2 paired -->
  <rect class="card" x="376" y="64" width="300" height="330" rx="10"/>
  <text class="acc h" x="392" y="94">2 · Is B better? Count flips</text>
  <text class="muted xs" x="470" y="124">llama pass</text><text class="muted xs" x="566" y="124">llama fail</text>
  <text class="muted xs" x="392" y="160">qwen pass</text><text class="muted xs" x="392" y="222">qwen fail</text>
  <rect class="card" x="462" y="134" width="88" height="52" rx="6"/><text class="ink big" x="496" y="170">9</text>
  <rect class="bad" x="556" y="134" width="88" height="52" rx="6"/><text class="badt big" x="592" y="170">1</text>
  <rect class="ok" x="462" y="196" width="88" height="52" rx="6"/><text class="okt big" x="496" y="232">4</text>
  <rect class="card" x="556" y="196" width="88" height="52" rx="6"/><text class="ink big" x="592" y="232">2</text>
  <text class="ink s" x="392" y="282">Only the 5 flips carry evidence.</text>
  <text class="ink s" x="392" y="304">McNemar exact: p = 0.375</text>
  <text class="ink s" x="392" y="326">Paired range for the gain:</text>
  <text class="badt s" x="392" y="348">−6 to +44 points: includes 0</text>
  <text class="muted xs" x="392" y="375">→ not evidence llama is better</text>

  <!-- 3 how many -->
  <rect class="card" x="692" y="64" width="238" height="330" rx="10"/>
  <text class="acc h" x="708" y="94">3 · How many cases?</text>
  <text class="muted xs" x="708" y="120">n = z² p(1−p) / margin²  (p = 50%)</text>
  <text class="ink s" x="708" y="152">± 24 points</text><text class="acc s" x="846" y="152">16</text>
  <text class="ink s" x="708" y="180">± 20 points</text><text class="acc s" x="846" y="180">25</text>
  <text class="ink s" x="708" y="208">± 10 points</text><text class="acc s" x="846" y="208">97</text>
  <text class="ink s" x="708" y="236">± 5 points</text><text class="acc s" x="846" y="236">385</text>
  <text class="ink s" x="708" y="276">Repeat runs:</text>
  <text class="muted xs" x="708" y="296">7 of 10 tries pass</text>
  <text class="okt s" x="708" y="320">pass@3 = 99%</text>
  <text class="badt s" x="708" y="344">pass^3 = 29%</text>
  <text class="muted xs" x="708" y="375">"works" depends on the question</text>
</svg>
