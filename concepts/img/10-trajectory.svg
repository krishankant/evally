<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Agent checks</title>
  <desc id="d">Check inside the agent loop. Steps: an invented email and order id in gen-fa79bb81, caught by args_grounded. Trajectory: return-too-late called lookup_order, a failing start_return and escalate; exact match fails, in-order passes, an allowed set without start_return fails for the right reason. End state and budgets complete the picture; DeepEval's default tool check scores this path 1.00.</desc>
  <style>
    .bg{fill:#ffffff}.card{fill:#f4f5f9;stroke:#d5d8e1}.ink{fill:#1f2330}.muted{fill:#5d6475}
    .acc{fill:#3f51b5}.ok{fill:#e1f2ea}.okt{fill:#2e7d5b}.bad{fill:#fbe5e0}.badt{fill:#b3412e}.line{stroke:#9aa0b2}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1e2129}.card{fill:#272b35;stroke:#3a3f4c}.ink{fill:#e8eaf0}.muted{fill:#a3a9b8}
      .acc{fill:#8c9eff}.ok{fill:#1f3a2f}.okt{fill:#6fd3a3}.bad{fill:#432722}.badt{fill:#f2937f}.line{stroke:#6b7285}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .h{font-size:19px;font-weight:700}.s{font-size:14px}.xs{font-size:12.5px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  </style>
  <rect class="bg" width="960" height="420" rx="14"/>
  <text class="ink h" x="30" y="40">Agents fail inside the loop. Check the steps, the path and the result.</text>
  <rect class="card" x="30" y="64" width="290" height="330" rx="10"/>
  <text class="acc h" x="46" y="94">1 · Each step</text>
  <text class="muted xs" x="46" y="116">gen-fa79bb81 (real): no id or email given</text>
  <rect class="bad" x="46" y="128" width="258" height="56" rx="6"/>
  <text class="badt mono" x="56" y="150">lookup_order(</text>
  <text class="badt mono" x="66" y="170">"user@example.com","BB-1001")</text>
  <text class="ink s" x="46" y="212">args_grounded: every value must</text>
  <text class="ink s" x="46" y="231">appear in what the customer wrote</text>
  <text class="okt s" x="46" y="254">→ caught both invented values</text>
  <text class="ink s" x="46" y="292">Tool choice: missing · forbidden ·</text>
  <text class="ink s" x="46" y="311">wrong. Sometimes the toolset is</text>
  <text class="ink s" x="46" y="330">the gap: no search by title.</text>
  <rect class="card" x="336" y="64" width="300" height="330" rx="10"/>
  <text class="acc h" x="352" y="94">2 · The path</text>
  <text class="muted xs" x="352" y="116">return-too-late (real), expected [lookup_order]</text>
  <rect class="ok" x="352" y="128" width="110" height="30" rx="6"/><text class="okt mono" x="360" y="148">lookup_order</text>
  <rect class="bad" x="468" y="128" width="104" height="30" rx="6"/><text class="badt mono" x="474" y="148">start_return✗</text>
  <rect class="card" x="352" y="164" width="130" height="30" rx="6"/><text class="ink mono" x="360" y="184">escalate_to_human</text>
  <text class="ink s" x="352" y="222">exact match</text><text class="badt s" x="560" y="222">fail</text>
  <text class="ink s" x="352" y="244">in order</text><text class="okt s" x="560" y="244">pass</text>
  <text class="ink s" x="352" y="266">any order</text><text class="okt s" x="560" y="266">pass</text>
  <text class="ink s" x="352" y="288">allowed set (no start_return)</text><text class="badt s" x="560" y="288">fail ✓</text>
  <text class="muted xs" x="352" y="318">DeepEval default tool check: 1.00, passed.</text>
  <text class="ink s" x="352" y="346">Best: a negative rule. "Never</text>
  <text class="ink s" x="352" y="365">start_return past 30 days."</text>
  <rect class="card" x="652" y="64" width="278" height="330" rx="10"/>
  <text class="acc h" x="668" y="94">3 · The result</text>
  <text class="ink s" x="668" y="124">End state: what changed in</text>
  <text class="ink s" x="668" y="143">the store? (τ-bench style)</text>
  <text class="muted xs" x="668" y="163">beware tasks where doing nothing passes</text>
  <text class="ink s" x="668" y="198">Budgets: steps · tokens · time</text>
  <text class="muted xs" x="668" y="218">3 calls where 1 was enough</text>
  <text class="ink s" x="668" y="252">Multi-turn: simulated customer</text>
  <text class="muted xs" x="668" y="272">persona · goal · hidden facts · stop rule</text>
  <text class="badt xs" x="668" y="292">simulated users are too cooperative</text>
  <text class="ink s" x="668" y="328">Report pass^k: a customer</text>
  <text class="ink s" x="668" y="347">gets one conversation.</text>
</svg>
