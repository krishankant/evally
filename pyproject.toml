[project]
name = "evally"
version = "0.1.0"
description = "Learn how LLM evals work by testing one small support bot, one week at a time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# week 4: the same code checks in DeepEval, for comparison (uv sync --extra deepeval)
deepeval = ["deepeval==4.3.2"]

[project.scripts]
evally = "evally.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evally"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
